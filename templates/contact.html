{% extends "base.html" %}{% block content %}<section id="contact" class="wrap sec"><h2>Contact</h2>
<form class="panel" id="contactForm"><div class="fields"><label>Name<input id="c-name"></label><label>Email<input id="c-email" type="email"></label></div>
<label>Message<textarea id="c-msg" rows="4"></textarea></label><button class="btn primary" type="submit">Send message</button>
<div id="cErr" class="error" hidden></div><div id="cOk" class="ok" hidden>Message sent. Thank you!</div></form></section>{% endblock %}
